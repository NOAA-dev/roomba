joy_teleop:
  ros__parameters:
    move:
      type: topic
      interface_type: geometry_msgs/msg/TwistStamped
      topic_name: /joystick_input/stamped

      deadman_buttons: [5]

      axis_mappings:
        twist-linear-x:
          axis: 1
          scale: 0.25     # m/s at full stick = limits.max_wheel_speed_m_s (robot_dimensions.yaml)
          offset: 0.0

        twist-angular-z:
          axis: 2
          scale: 2.08     # rad/s at full stick = cap / (track / 2), rounded down
          offset: 0.0

          
