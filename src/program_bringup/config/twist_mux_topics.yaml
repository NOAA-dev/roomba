twist_mux:
  ros__parameters:
    use_stamped: false
    topics:
      joystick:
        topic   : /joystick_input
        timeout : 0.5
        priority: 99
      autonomous: 
        topic   : /autonomous_cmd_vel
        timeout : 0.5
        priority: 90
      keyboard: 
        topic   : key_vel
        timeout : 0.5
        priority: 80